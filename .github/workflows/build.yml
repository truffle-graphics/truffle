name: Build

on:
  workflow_dispatch:

jobs:
  architecture:
    name: architecture-guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check target and public-header boundaries
        run: python3 tools/check_architecture.py --report

  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            metal: OFF
          - os: macos-latest
            metal: ON
          - os: windows-latest
            metal: OFF

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux example prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxcb1-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            mesa-vulkan-drivers \
            vulkan-validationlayers \
            wayland-protocols \
            xvfb

      - name: Configure
        run: cmake --preset debug -DTFL_WARNINGS_AS_ERRORS=ON -DTFL_BUILD_BACKEND_METAL=${{ matrix.metal }}

      - name: Build
        run: cmake --build --preset debug

      - name: Run shared contract tests
        run: ctest --preset debug -LE "native-smoke|presentation|validation"

      - name: Run native smoke with API validation
        env:
          MTL_DEBUG_LAYER: 1
        run: ctest --preset debug -L native-smoke

      - name: Run native presentation proof
        if: runner.os == 'macOS' || runner.os == 'Windows'
        env:
          MTL_DEBUG_LAYER: 1
        run: ctest --preset debug -L presentation

      - name: Run Linux native presentation proof
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ctest --preset debug -L presentation

      - name: Run strict RHI doctor
        run: |
          cmake -E make_directory build/_scratch/debug
          ./out/debug/bin/truffle-rhi-doctor${{ runner.os == 'Windows' && '.exe' || '' }} --strict --json build/_scratch/debug/rhi-doctor.json

      - name: Generate backend parity report
        run: cmake -DTFL_BUILD_DIR="${{ github.workspace }}/build/debug" -DTFL_REPORT_OUT="${{ github.workspace }}/build/_scratch/debug/parity-matrix.md" -P cmake/GenerateParityReport.cmake

      - name: Upload backend parity report
        uses: actions/upload-artifact@v4
        with:
          name: backend-parity-matrix-${{ matrix.os }}
          path: |
            build/_scratch/debug/parity-matrix.md
            build/_scratch/debug/parity-matrix.json
            build/_scratch/debug/rhi-parity-report.json
            build/_scratch/debug/rhi-doctor.json
            build/_scratch/debug/*.parity.log
          if-no-files-found: error

  package:
    name: package-archive
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Prepare package dependencies
        run: git submodule update --init vendor/freetype vendor/harfbuzz vendor/sheenbidi vendor/utf8proc

      - name: Configure package build
        run: cmake --preset package

      - name: Build package targets
        run: cmake --build --preset package

      - name: Install package layout
        run: cmake --install build/package

      - name: Generate archives with CPack
        working-directory: build/package
        run: cpack --verbose

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: truffle-package-archives
          path: |
            install/package/packages/*.tar.gz
            install/package/packages/*.zip
          if-no-files-found: error
