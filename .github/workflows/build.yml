name: Build

on:
  pull_request:
  push:
    branches:
      - develop
      - master

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            metal: OFF
          - os: macos-latest
            metal: ON
          - os: windows-latest
            metal: OFF

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux example prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            mesa-vulkan-drivers \
            vulkan-validationlayers \
            wayland-protocols

      - name: Configure
        run: cmake --preset ci -DTRUFFLE_BUILD_BACKEND_METAL=${{ matrix.metal }}

      - name: Build
        run: cmake --build --preset ci

      - name: Run shared contract tests
        run: ctest --preset ci -LE "native-smoke|presentation|validation"

      - name: Run native smoke with API validation
        env:
          MTL_DEBUG_LAYER: 1
        run: ctest --preset ci -L native-smoke

      - name: Run native presentation proof
        if: runner.os == 'macOS' || runner.os == 'Windows'
        env:
          MTL_DEBUG_LAYER: 1
        run: ctest --preset ci -L presentation

      - name: Run strict RHI doctor
        run: ./build/ci/tools/rhi-doctor/truffle-rhi-doctor${{ runner.os == 'Windows' && '.exe' || '' }} --strict --json build/ci/rhi-doctor.json

      - name: Generate backend parity report
        run: cmake -DTRUFFLE_BUILD_DIR="${{ github.workspace }}/build/ci" -DTRUFFLE_REPORT_OUT="${{ github.workspace }}/build/ci/parity-matrix.md" -P cmake/GenerateParityReport.cmake

      - name: Upload backend parity report
        uses: actions/upload-artifact@v4
        with:
          name: backend-parity-matrix-${{ matrix.os }}
          path: |
            build/ci/parity-matrix.md
            build/ci/parity-matrix.json
            build/ci/rhi-parity-report.json
            build/ci/rhi-doctor.json
            build/ci/*.parity.log
          if-no-files-found: error

  package:
    name: package-archive
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure package build
        run: |
          cmake -S . -B build/package \
            -DTRUFFLE_INSTALL=ON \
            -DTRUFFLE_BUILD_RHI_DOCTOR=OFF \
            -DTRUFFLE_BUILD_TESTS=OFF \
            -DTRUFFLE_BUILD_EXAMPLES=OFF

      - name: Build package targets
        run: cmake --build build/package

      - name: Install package layout
        run: cmake --install build/package --prefix build/package/install

      - name: Generate archives with CPack
        working-directory: build/package
        run: cpack --verbose

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: truffle-package-archives
          path: |
            build/package/*.tar.gz
            build/package/*.zip
          if-no-files-found: error
