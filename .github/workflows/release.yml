name: Release

on:
  workflow_dispatch:

jobs:
  release:
    name: package-and-release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Require a release tag
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != v* ]]; then
            echo "::error::Dispatch Release against an existing signed v* tag, not a branch."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Prepare GUI text dependencies
        run: git submodule update --init vendor/freetype vendor/harfbuzz vendor/sheenbidi vendor/utf8proc

      - name: Configure package build
        run: |
          cmake --preset package -DTFL_BUILD_TESTS=ON

      - name: Build package
        run: cmake --build --preset package

      - name: Install package layout
        run: cmake --install build/package

      - name: Create package archives
        working-directory: build/package
        run: cpack --verbose

      - name: Generate backend parity report
        run: |
          cmake \
            -DTFL_BUILD_DIR=${{ github.workspace }}/build/package \
            -DTFL_REPORT_OUT=${{ github.workspace }}/build/_scratch/package/parity-matrix.md \
            -P cmake/GenerateParityReport.cmake

      - name: Upload parity report artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-parity-matrix-release
          path: |
            build/_scratch/package/parity-matrix.md
            build/_scratch/package/parity-matrix.json
            build/_scratch/package/rhi-parity-report.json
            build/_scratch/package/*.parity.log
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            install/package/packages/*.tar.gz
            install/package/packages/*.zip
            build/_scratch/package/parity-matrix.md
            build/_scratch/package/parity-matrix.json
            build/_scratch/package/rhi-parity-report.json
